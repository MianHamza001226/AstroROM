name: Build AstroROM for x1q (SCG01)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-x1q:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git wget curl unzip tar lz4 \
            python3 python3-pip \
            simg2img e2fsprogs \
            squashfs-tools \
            bc cpio rsync \
            android-sdk-libsparse-utils

      # -----------------------------
      # Firmware setup (SCG01 / KDI)
      # -----------------------------
      - name: Prepare firmware directory
        run: |
          mkdir -p firmware/x1q

      - name: Install samloader
        run: |
          git clone https://github.com/nlscc/samloader.git
          cd samloader
          pip3 install .

      - name: Resolve latest firmware version (SCG01 KDI)
        id: fw
        run: |
          FW_VER=$(samloader checkupdate -m SCG01 -r KDI \
            | grep -i "Latest firmware version" \
            | cut -d':' -f2 \
            | tr -d ' ')

          if [ -z "$FW_VER" ]; then
            echo "Firmware version detection failed"
            exit 1
          fi

          echo "fw_ver=$FW_VER" >> $GITHUB_OUTPUT
          echo "Using firmware: $FW_VER"

      - name: Download firmware
        run: |
          samloader download \
            -m SCG01 \
            -r KDI \
            -v "${{ steps.fw.outputs.fw_ver }}" \
            -O firmware/x1q

      - name: Extract firmware
        run: |
          cd firmware/x1q

          # unzip firmware package
          for z in *.zip; do
            unzip -q "$z"
          done
