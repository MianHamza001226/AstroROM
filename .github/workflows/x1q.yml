name: Build AstroROM for x1q (SCG01)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-x1q:
    runs-on: ubuntu-22.04

    steps:
      # -----------------------------
      # Checkout repo
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Install dependencies
      # -----------------------------
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git wget curl unzip tar lz4 \
            python3 python3-pip \
            simg2img e2fsprogs \
            squashfs-tools \
            bc cpio rsync \
            android-sdk-libsparse-utils

      # -----------------------------
      # Prepare firmware directory
      # -----------------------------
      - name: Prepare firmware directory
        run: mkdir -p firmware/x1q

      # -----------------------------
      # Install samloader
      # -----------------------------
      - name: Install samloader
        run: |
          git clone https://github.com/nlscc/samloader.git
          cd samloader
          sudo pip3 install .

      # -----------------------------
      # Download SCG01KDS1DXB1 firmware
      # -----------------------------
      - name: Download firmware (SCG01 KDI)
        run: |
          samloader \
            -m SCG01 \
            -r KDI \
            download \
            -v SCG01KDS1DXB1 \
            -O firmware/x1q

      # -----------------------------
      # Extract AP contents
      # -----------------------------
      - name: Extract firmware
        run: |
          cd firmware/x1q
          unzip -q "*.zip"
          if ls AP_*.tar.md5 1>/dev/null 2>&1; then
            tar -xf AP_*.tar.md5
          else
            echo "AP archive missing"
            exit 1
          fi

      # -----------------------------
      # Build AstroROM
      # -----------------------------
      - name: Build AstroROM (x1q)
        run: |
          chmod +x build.sh
          sudo ./build.sh -b x1q

      # -----------------------------
      # Upload output artifacts
      # -----------------------------
      - name: Upload ROM output
        uses: actions/upload-artifact@v4
        with:
          name: AstroROM-x1q-SCG01
          path: |
            out/
            workspace/
