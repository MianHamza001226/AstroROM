name: Build AstroROM for x1q

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-x1q:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git wget curl unzip \
            lz4 tar python3 \
            android-sdk-libsparse-utils \
            simg2img e2fsprogs \
            squashfs-tools \
            bc cpio rsync

      - name: Setup firmware directory
        run: |
          mkdir -p firmware/x1q

      - name: Download Samsung firmware (x1q)
        run: |
          git clone https://github.com/nlscc/samloader.git
          cd samloader
          pip3 install .
          samloader download \
            --model SM-G986U \
            --region XAA \
            --firmware latest \
            --output ../firmware/x1q

      - name: Extract firmware
        run: |
          cd firmware/x1q
          for f in *.zip; do unzip "$f"; done

      - name: Build ROM
        run: |
          sudo bash build.sh -b x1q

      - name: Upload ROM output
        uses: actions/upload-artifact@v4
        with:
          name: AstroROM-x1q
          path: |
            out/
            workspace/
