# GitHub Actions workflow to run build.sh for the x1q device
# - Runs on push to main and manual workflow_dispatch
# - Prepares objectives/x1q/x1q.sh using repository defaults and GitHub Secrets (IMEI, STOCK_IMEI)
# - Installs common utilities, makes scripts executable, runs sudo ./build.sh -d -b x1q
# - Uploads the out/ directory as an artifact
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-x1q:
    name: Build ROM for x1q
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packages
        # install common utilities used by build.sh and device scripts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rsync unzip zip curl unzip default-jre build-essential git python3 jq
          # Try to install apktool if available via apt; otherwise leave it for device scripts to fetch
          sudo apt-get install -y apktool || true

      - name: Prepare objectives/x1q/x1q.sh
        # Use repository values where present; override sensitive fields from repo secrets.
        # Provide placeholders for secrets if they're not set in the repo's Secrets.
        env:
          IMEI: ${{ secrets.IMEI }}
          STOCK_IMEI: ${{ secrets.STOCK_IMEI }}
        run: |
          mkdir -p objectives/x1q
          cat > objectives/x1q/x1q.sh <<'EOF'
          #!/usr/bin/env bash
          # Generated by .github/workflows/build_x1q.yml
          MODEL_NAME="Galaxy S20 5G"
          CODENAME="x1q"
          STOCK_MODEL="SM-G981N"
          STOCK_CSC="KOO"
          # STOCK_IMEI may be provided via GitHub Secrets (recommended)
          STOCK_IMEI="${STOCK_IMEI:-REPLACE_WITH_STOCK_IMEI_IF_NEEDED}"
          MODEL="SM-G998U1"
          CSC="ATT"
          # IMEI should be stored in GitHub Secrets, not committed to the repo
          IMEI="${IMEI:-REPLACE_WITH_IMEI_IF_NEEDED}"
          PLATFORM="sd_8250"
          VNDK="30"
          FILESYSTEM="erofs"
          DEVICE_HAVE_SPEN=false
          DEVICE_HAS_HIGH_REFRESH_RATE=true
          export MODEL_NAME CODENAME STOCK_MODEL STOCK_CSC STOCK_IMEI MODEL CSC IMEI PLATFORM VNDK FILESYSTEM DEVICE_HAVE_SPEN DEVICE_HAS_HIGH_REFRESH_RATE
          EOF
          chmod +x objectives/x1q/x1q.sh
          echo "Prepared objectives/x1q/x1q.sh (sensitive values taken from Secrets if provided)"

      - name: Ensure build scripts are executable
        run: |
          chmod +x ./build.sh || true
          find . -type f -name "*.sh" -exec chmod +x {} \; || true

      - name: Run build (x1q)
        # Run build as root; the runner allows sudo. Add reasonable timeout.
        # Use debug flag to get more diagnostic output.
        run: |
          sudo ./build.sh --debug --build x1q
        timeout-minutes: 120

      - name: List out/ and workspace/ (for debug)
        if: always()
        run: |
          echo "=== out/ ==="
          ls -la out || true
          echo "=== workspace/ ==="
          ls -la workspace || true
          echo "=== firmware/unpacked/ ==="
          ls -la firmware/unpacked || true

      - name: Upload build output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astrorom-out
          path: |
            out
            workspace
            firmware/unpacked
