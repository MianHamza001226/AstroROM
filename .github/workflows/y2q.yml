name: Build AstroROM

on:
  workflow_dispatch: 
    inputs:
      device: 
        description: 'Device Codename (e.g., dm3q, y2q)'
        required: true
        default: 'y2q'
        type: string
      upload_cloud:
        description: 'Upload ROM to cloud (PixelDrain)'
        required: false
        default:  false
        type: boolean
      build_type:
        description: 'Build Type'
        required: false
        default: 'userdebug'
        type:  choice
        options:
          - user
          - userdebug
          - eng

env:
  DEVICE: ${{ inputs.device }}
  BUILD_TYPE: ${{ inputs.build_type }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 480

    steps:
      - name: Checkout Repository
        uses:  actions/checkout@v4
        with:
          fetch-depth: 1

      # ===============================================
      # DISK SPACE OPTIMIZATION
      # ===============================================
      
      - name: Free Disk Space (Step 1/4) - Remove System Packages
        run: |
          echo "=== Before Cleanup ==="
          df -h /
          echo ""
          echo "Removing unnecessary packages..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/share/sbt
          sudo docker image prune --all --force
          sudo docker builder prune -af

      - name: Free Disk Space (Step 2/4) - Tool Cache Cleanup
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache:  true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage:  false

      - name: Free Disk Space (Step 3/4) - SlimHub Actions
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name:  Free Disk Space (Step 4/4) - Final Cleanup
        run: |
          sudo apt-get autoremove -y
          sudo apt-get autoclean -y
          sudo apt-get clean
          echo ""
          echo "=== After Cleanup ==="
          df -h /

      # ===============================================
      # BUILD PROCESS
      # ===============================================

      - name: Display Build Information
        run: |
          echo "╔══════════════════════════════════════╗"
          echo "║       AstroROM Build Starting        ║"
          echo "╚═════════════════════════════════��════╝"
          echo ""
          echo "Device:       ${{ env.DEVICE }}"
          echo "Build Type:  ${{ env.BUILD_TYPE }}"
          echo "Upload:       ${{ inputs.upload_cloud }}"
          echo "Runner:      ubuntu-24.04"
          echo "Triggered by: @${{ github.actor }}"
          echo ""
          echo "=== System Information ==="
          uname -a
          echo ""
          echo "=== Available Disk Space ==="
          df -h /
          echo ""
          echo "=== CPU Information ==="
          lscpu | grep -E "^CPU\(s\)|Model name|Thread|Core"

      - name: Build AstroROM
        id: build
        run: |
          echo "Starting build process..."
          sudo bash build.sh --build ${{ env.DEVICE }}
          
          echo "Build completed successfully!"
          
          # Check if output directory exists
          if [ !  -d "out" ]; then
            echo "❌ Error: Output directory not found!"
            exit 1
          fi
          
          # List build artifacts
          echo ""
          echo "=== Build Artifacts ==="
          ls -lh out/

      - name: Get ROM Information
        id: rom_info
        if: success()
        run: |
          cd out
          ROM_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          
          if [ -z "$ROM_FILE" ]; then
            echo "❌ No ROM file found!"
            exit 1
          fi
          
          ROM_SIZE=$(du -h "$ROM_FILE" | cut -f1)
          ROM_SIZE_MB=$(du -m "$ROM_FILE" | cut -f1)
          
          echo "rom_file=$ROM_FILE" >> $GITHUB_OUTPUT
          echo "rom_size=$ROM_SIZE" >> $GITHUB_OUTPUT
          echo "rom_size_mb=$ROM_SIZE_MB" >> $GITHUB_OUTPUT
          
          echo ""
          echo "✅ ROM Built Successfully!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 File: $ROM_FILE"
          echo "📊 Size: $ROM_SIZE ($ROM_SIZE_MB MB)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  
